---
- name: Start unattended Windows in-place upgrade
  ansible.windows.win_powershell:
    script: |
      $setup = Join-Path '{{ windows_media_path }}' 'setup.exe'
      if (-not (Test-Path $setup)) { throw "setup.exe not found at $setup" }
      $arguments = '/auto upgrade /quiet /eula accept /dynamicupdate {{ windows_dynamic_update | default("disable") }} /compat ignorewarning /copylogs C:\Windows\Temp\AnsibleInPlaceUpgrade'
      $process = Start-Process -FilePath $setup -ArgumentList $arguments -PassThru
      [pscustomobject]@{ ProcessId = $process.Id; Started = $true }
  delegate_to: inplace_upgrade_guest
  register: inplace_upgrade_windows_start

- name: Wait for the Windows guest to reboot and return
  ansible.builtin.wait_for_connection:
    delay: 120
    sleep: 30
    timeout: "{{ inplace_upgrade_reboot_timeout }}"
  delegate_to: inplace_upgrade_guest
