---
- name: Assert required variables/facts are defined
  ansible.builtin.assert:
    that:
      - vm_name is defined
      - snapshot_hyperv_host is defined
      - snapshot_revert_target is defined

- name: Revert the Hyper-V VM to the checkpoint
  delegate_to: "{{ snapshot_hyperv_host }}"
  ansible.windows.win_shell:
    cmd: |
      $ErrorActionPreference = "Stop"
      $snap = Get-VMSnapshot -VMName '{{ vm_name }}' | Where-Object { $_.Id -eq [guid]'{{ snapshot_revert_target.id }}' }
      if (-not $snap) {
          throw "Checkpoint {{ snapshot_revert_target.id }} no longer exists on '{{ vm_name }}' - removed by someone else since this run started?"
      }
      $snap | Restore-VMSnapshot -Confirm:$false
  register: snapshot_revert_result

- name: Report the revert
  ansible.builtin.debug:
    msg: "'{{ vm_name }}' reverted to checkpoint '{{ snapshot_revert_target.name }}' (id {{ snapshot_revert_target.id }})."
