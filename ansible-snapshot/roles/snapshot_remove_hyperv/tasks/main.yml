---
- name: Assert required variables/facts are defined
  ansible.builtin.assert:
    that:
      - vm_name is defined
      - snapshot_hyperv_host is defined
      - snapshot_remove_target is defined

- name: Remove the Hyper-V checkpoint
  delegate_to: "{{ snapshot_hyperv_host | default('localhost', true) }}"
  ansible.windows.win_shell:
    cmd: |
      $ErrorActionPreference = "Stop"
      $snap = Get-VMSnapshot -VMName '{{ vm_name }}' | Where-Object { $_.Id -eq [guid]'{{ snapshot_remove_target.id }}' }
      if (-not $snap) {
          throw "Checkpoint {{ snapshot_remove_target.id }} no longer exists on '{{ vm_name }}' - removed by someone else since this run started?"
      }
      {{ "$snap | Remove-VMSnapshot -IncludeAllChildSnapshots" if snapshot_remove_children | bool else "$snap | Remove-VMSnapshot" }}
  register: snapshot_remove_result

- name: Report the removed checkpoint
  ansible.builtin.debug:
    msg: "Checkpoint '{{ snapshot_remove_target.name }}' (id {{ snapshot_remove_target.id }}) removed from '{{ vm_name }}'."
