---
- name: Assert required variables/facts are defined
  ansible.builtin.assert:
    that:
      - scvmm_server is defined
      - scvmm_server | length > 0
      - vm_name is defined
      - snapshot_remove_target is defined

- name: Remove the checkpoint via SCVMM
  delegate_to: "{{ scvmm_server | default('localhost', true) }}"
  ansible.windows.win_shell:
    cmd: |
      $ErrorActionPreference = "Stop"
      Import-Module virtualmachinemanager -ErrorAction SilentlyContinue
      Get-SCVMMServer -ComputerName '{{ scvmm_server }}' | Out-Null

      $vm = Get-SCVirtualMachine -Name '{{ vm_name }}'
      if (-not $vm) {
          throw "VM '{{ vm_name }}' not found in SCVMM"
      }

      $checkpoint = Get-SCVMCheckpoint -VM $vm | Where-Object { $_.Name -eq '{{ snapshot_remove_target.name }}' }
      if (-not $checkpoint) {
          throw "Checkpoint '{{ snapshot_remove_target.name }}' no longer exists on '{{ vm_name }}' in SCVMM - removed by someone else since this run started?"
      }

      Remove-SCVMCheckpoint -VMCheckpoint $checkpoint | Out-Null
  register: snapshot_remove_result

- name: Report the removed checkpoint
  ansible.builtin.debug:
    msg: "Checkpoint '{{ snapshot_remove_target.name }}' removed from '{{ vm_name }}' via SCVMM."
