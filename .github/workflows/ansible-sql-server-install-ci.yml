name: ansible-sql-server-install CI

on:
  push:
    paths:
      - 'ansible-sql-server-install/**'
      - '.github/workflows/ansible-sql-server-install-ci.yml'
  pull_request:
    paths:
      - 'ansible-sql-server-install/**'
      - '.github/workflows/ansible-sql-server-install-ci.yml'

defaults:
  run:
    working-directory: ansible-sql-server-install

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install tooling
        run: pip install yamllint ansible-core ansible-lint

      - name: Install required collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: ansible-playbook --syntax-check
        run: |
          cp inventory/hosts.yml.example inventory/hosts.yml
          ansible-playbook playbooks/install_sql_server.yml --syntax-check
