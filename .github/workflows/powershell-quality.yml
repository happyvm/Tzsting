name: PowerShell Quality

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error, Warning, Information
          if ($issues) {
            $issues | Format-Table -AutoSize
            throw "PSScriptAnalyzer found $($issues.Count) issue(s) (Error/Warning/Information)."
          }

      # ansible-resizedisk embeds its PowerShell as Jinja-templated YAML
      # string literals (win_shell tasks, run_guest_command script vars),
      # so the scan above never sees it - -Recurse only picks up .ps1/.psm1
      # files. Extract it to standalone files first (Jinja {{ }} swapped
      # for a numeric placeholder so it stays syntactically valid) and
      # scan those too, same job so PSScriptAnalyzer is only installed once.
      - name: Set up Python for the extraction script
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install extraction script dependencies
        run: pip install pyyaml

      - name: Extract embedded PowerShell from ansible-resizedisk
        run: python3 ansible-resizedisk/scripts/extract_embedded_scripts.py powershell

      - name: Run PSScriptAnalyzer on ansible-resizedisk's embedded PowerShell
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path ansible-resizedisk/.extracted/powershell -Recurse -Severity Error, Warning `
            -Settings ansible-resizedisk/scripts/PSScriptAnalyzerSettings.psd1
          if ($issues) {
            $issues | Format-Table -AutoSize
            throw "PSScriptAnalyzer found $($issues.Count) issue(s) in ansible-resizedisk's embedded PowerShell."
          }

      - name: Extract embedded PowerShell from ansible-snapshot
        run: python3 ansible-snapshot/scripts/extract_embedded_scripts.py powershell

      - name: Run PSScriptAnalyzer on ansible-snapshot's embedded PowerShell
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path ansible-snapshot/.extracted/powershell -Recurse -Severity Error, Warning `
            -Settings ansible-snapshot/scripts/PSScriptAnalyzerSettings.psd1
          if ($issues) {
            $issues | Format-Table -AutoSize
            throw "PSScriptAnalyzer found $($issues.Count) issue(s) in ansible-snapshot's embedded PowerShell."
          }

      - name: Extract embedded PowerShell from ansible-resizecompute
        run: python3 ansible-resizecompute/scripts/extract_embedded_scripts.py powershell

      - name: Run PSScriptAnalyzer on ansible-resizecompute's embedded PowerShell
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path ansible-resizecompute/.extracted/powershell -Recurse -Severity Error, Warning `
            -Settings ansible-resizecompute/scripts/PSScriptAnalyzerSettings.psd1
          if ($issues) {
            $issues | Format-Table -AutoSize
            throw "PSScriptAnalyzer found $($issues.Count) issue(s) in ansible-resizecompute's embedded PowerShell."
          }

      - name: Extract embedded PowerShell from ansible-createvm
        run: python3 ansible-createvm/scripts/extract_embedded_scripts.py powershell

      - name: Run PSScriptAnalyzer on ansible-createvm's embedded PowerShell
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path ansible-createvm/.extracted/powershell -Recurse -Severity Error, Warning `
            -Settings ansible-createvm/scripts/PSScriptAnalyzerSettings.psd1
          if ($issues) {
            $issues | Format-Table -AutoSize
            throw "PSScriptAnalyzer found $($issues.Count) issue(s) in ansible-createvm's embedded PowerShell."
          }

      - name: Extract embedded PowerShell from ansible-deletevm
        run: python3 ansible-deletevm/scripts/extract_embedded_scripts.py powershell

      - name: Run PSScriptAnalyzer on ansible-deletevm's embedded PowerShell
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path ansible-deletevm/.extracted/powershell -Recurse -Severity Error, Warning `
            -Settings ansible-deletevm/scripts/PSScriptAnalyzerSettings.psd1
          if ($issues) {
            $issues | Format-Table -AutoSize
            throw "PSScriptAnalyzer found $($issues.Count) issue(s) in ansible-deletevm's embedded PowerShell."
          }

