name: ansible-resizedisk CI

on:
  push:
    paths:
      - 'ansible-resizedisk/**'
      - '.github/workflows/ansible-resizedisk-ci.yml'
  pull_request:
    paths:
      - 'ansible-resizedisk/**'
      - '.github/workflows/ansible-resizedisk-ci.yml'

defaults:
  run:
    working-directory: ansible-resizedisk

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install tooling
        run: pip install yamllint ansible-core ansible-lint

      - name: Install required collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: ansible-playbook --syntax-check
        run: |
          cp inventory/hosts.yml.example inventory/hosts.yml
          ansible-playbook playbooks/resize_disk.yml --syntax-check

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install extraction script dependencies
        run: pip install pyyaml

      - name: Extract embedded bash from resize_linux_filesystem
        run: python3 scripts/extract_embedded_scripts.py bash

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Run ShellCheck
        run: shellcheck -s bash .extracted/bash/*.sh
