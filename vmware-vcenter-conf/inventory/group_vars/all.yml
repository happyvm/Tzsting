---
# Secrets must be provided through Ansible Vault or an AAP credential.
# vcenter_hostname/username/password and vmware_validate_certs use the same
# names as ansible-createvm/ansible-resizecompute/ansible-resizedisk/etc, so
# an existing vCenter credential set can be reused as-is.
vcenter_hostname: vcenter.example.local
vcenter_username: "{{ vault_vcenter_username }}"
vcenter_password: "{{ vault_vcenter_password }}"
vmware_validate_certs: false

# VAMI (the vCenter Server Appliance's own management API, distinct from
# the vCenter/SSO API above) credential - often the same administrator
# account, but some deployments use a dedicated appliance/root account.
vcenter_vami_username: "{{ vault_vcenter_vami_username | default(vcenter_username) }}"
vcenter_vami_password: "{{ vault_vcenter_vami_password | default(vcenter_password) }}"
vcenter_vami_headers:
  Accept: application/json
  Content-Type: application/json

# VAMI REST resource paths/payloads depend on the vCenter release. Set
# them from the API guide for the target version - see README.
vcenter_conf_ntp_endpoint: ""
vcenter_conf_ntp_method: PUT
vcenter_conf_ntp_configuration:
  mode: NTP
  servers:
    - ntp01.example.local
    - ntp02.example.local

vcenter_conf_timezone_endpoint: ""
vcenter_conf_timezone_method: PUT
vcenter_conf_timezone_configuration:
  timezone: UTC

vcenter_conf_local_admin_endpoint: ""
vcenter_conf_local_admin_method: PATCH
vcenter_conf_local_admin_username: root
vcenter_conf_local_admin_password: "{{ vault_vcenter_conf_local_admin_password }}"

# Covered by the real community.vmware.vmware_vcenter_settings module -
# see https://kb.vmware.com choices: none/error/warning/info/verbose/trivia.
vcenter_conf_logging_options: info

# Disabled by default. vmware_vcenter_settings applies mail, SNMP receivers
# and logging_options together in one call - see roles/logging/tasks/main.yml
# for why disabling below still runs the task (with explicit blank/disabled
# values) rather than skipping it.
vcenter_conf_smtp_enabled: false
vcenter_conf_smtp:
  server: smtp.example.local
  sender: "vcenter01-alerts@example.local"

# Only v1/v2c (community string) receivers exist in this module - there is
# no SNMPv3 support for vCenter server alerts in community.vmware.
vcenter_conf_snmp_enabled: false
vcenter_conf_snmp_receivers:
  snmp_receiver_1_url: snmp01.example.local
  snmp_receiver_1_enabled: true
  snmp_receiver_1_port: 162
  snmp_receiver_1_community: "{{ vault_vcenter_conf_snmp_community | default('') }}"
  snmp_receiver_2_url: ""
  snmp_receiver_2_enabled: false
  snmp_receiver_2_port: 162
  snmp_receiver_2_community: ""
  snmp_receiver_3_url: ""
  snmp_receiver_3_enabled: false
  snmp_receiver_3_port: 162
  snmp_receiver_3_community: ""
  snmp_receiver_4_url: ""
  snmp_receiver_4_enabled: false
  snmp_receiver_4_port: 162
  snmp_receiver_4_community: ""

# Explicit all-disabled/blank payload submitted instead when SNMP is
# disabled - do not rely on the module's own defaults, whose receiver 1
# default is "enabled: true" pointing at localhost:162/public.
vcenter_conf_snmp_receivers_disabled:
  snmp_receiver_1_url: ""
  snmp_receiver_1_enabled: false
  snmp_receiver_1_port: 162
  snmp_receiver_1_community: ""
  snmp_receiver_2_url: ""
  snmp_receiver_2_enabled: false
  snmp_receiver_2_port: 162
  snmp_receiver_2_community: ""
  snmp_receiver_3_url: ""
  snmp_receiver_3_enabled: false
  snmp_receiver_3_port: 162
  snmp_receiver_3_community: ""
  snmp_receiver_4_url: ""
  snmp_receiver_4_enabled: false
  snmp_receiver_4_port: 162
  snmp_receiver_4_community: ""

# Disabled by default. VAMI REST resource path/payload depends on the
# vCenter release, same convention as NTP/timezone/local_admin above.
vcenter_conf_syslog_enabled: false
vcenter_conf_syslog_endpoint: ""
vcenter_conf_syslog_method: PUT
vcenter_conf_syslog_configuration:
  hostname: syslog01.example.local
  port: 514
  protocol: TCP

# Disabled by default. Configures the VCSA's own file-based backup schedule
# via the real vmware.vmware.vcsa_backup_schedule module (vSphere
# Automation API - uses vcenter_hostname/username/password above, not the
# VAMI credential). A backup server/share must already exist and be
# reachable by the appliance; this only points the appliance at it - see
# README. Only one schedule can exist per appliance ("default" is what the
# UI creates, kept here so this role manages the same schedule the web UI
# would).
vcenter_conf_backup_enabled: false
vcenter_conf_backup_name: default
vcenter_conf_backup:
  # Supported schemes: FTPS, HTTPS, SFTP, FTP, NFS, SMB, HTTP.
  location_url: "sftp://backup01.example.local/vcenter/{{ vcenter_hostname }}"
  location_username: "{{ vault_vcenter_conf_backup_location_username | default('') }}"
  location_password: "{{ vault_vcenter_conf_backup_location_password | default('') }}"
  # Unset (empty string) leaves the backup unencrypted - set to enable it.
  encryption_password: "{{ vault_vcenter_conf_backup_encryption_password | default('') }}"
  retain_count: 3
  db_fast_backup: false
  include_stats_events_and_tasks: true
  include_supervisors_control_plane: true
  schedule:
    hour: 23
    minute: 30
    days_of_week:
      - SATURDAY

# The module has no way to verify the *current* value of a write-only
# password field, so it can only either always report changed when a
# password is set, or always keep applying it silently without ever
# reporting the difference. Kept false here (only report changed when a
# non-password field actually differs) to avoid false "changed" runs; the
# tradeoff is that a password rotated in isolation won't be flagged as a
# change - see README.
vcenter_conf_backup_always_update_password: false
