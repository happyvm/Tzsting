---
collections:
  - name: community.vmware
    version: ">=4.0.0,<7.0.0"
  - name: vmware.vmware
    version: ">=2.0.0,<4.0.0"

# community.vmware.vmware_vcenter_settings covers general vCenter server
# settings (logging, SNMP, mail...) but not the vCenter Server Appliance's
# own NTP/timezone/local-account settings - those live behind the VAMI
# (appliance management) REST API, which no collection wraps. See
# roles/ntp, roles/timezone and roles/local_admin.
#
# vmware.vmware.vcsa_backup_schedule (used by roles/backup) is a real
# module covering the VCSA's own file-based backup schedule, over the
# regular vCenter API (vcenter_hostname/username/password), not VAMI.
