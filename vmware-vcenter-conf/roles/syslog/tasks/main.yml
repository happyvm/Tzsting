---
- name: Configure vCenter Appliance remote syslog forwarding via VAMI
  when: vcenter_conf_syslog_enabled | bool
  ansible.builtin.uri:
    url: "https://{{ vcenter_hostname }}{{ vcenter_conf_syslog_endpoint }}"
    method: "{{ vcenter_conf_syslog_method }}"
    url_username: "{{ vcenter_vami_username }}"
    url_password: "{{ vcenter_vami_password }}"
    force_basic_auth: true
    validate_certs: "{{ vmware_validate_certs }}"
    headers: "{{ vcenter_vami_headers }}"
    body_format: json
    body: "{{ vcenter_conf_syslog_configuration }}"
    status_code: [200, 201, 202, 204]
  register: syslog_result
  changed_when: syslog_result.status in [201, 202, 204]
  no_log: true
