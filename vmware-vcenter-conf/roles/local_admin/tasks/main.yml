---
- name: Rotate the local vCenter Appliance administrator password via VAMI
  ansible.builtin.uri:
    url: "https://{{ vcenter_hostname }}{{ vcenter_conf_local_admin_endpoint }}"
    method: "{{ vcenter_conf_local_admin_method }}"
    url_username: "{{ vcenter_vami_username }}"
    url_password: "{{ vcenter_vami_password }}"
    force_basic_auth: true
    validate_certs: "{{ vmware_validate_certs }}"
    headers: "{{ vcenter_vami_headers }}"
    body_format: json
    body:
      new_password: "{{ vcenter_conf_local_admin_password }}"
    status_code: [200, 201, 202, 204]
  register: local_admin_result
  changed_when: local_admin_result.status in [201, 202, 204]
  no_log: true
