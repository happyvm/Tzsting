---
- name: Attach the VM's network adapter to the new VM Network
  when: scvmm_vm_name | default('') | length > 0
  delegate_to: "{{ scvmm_server | default('localhost', true) }}"
  ansible.windows.win_shell:
    cmd: |
      $ErrorActionPreference = "Stop"
      Import-Module virtualmachinemanager -ErrorAction SilentlyContinue
      Get-SCVMMServer -ComputerName '{{ scvmm_server }}' | Out-Null

      $vm = Get-SCVirtualMachine -Name '{{ scvmm_vm_name }}'
      if (-not $vm) {
          throw "VM '{{ scvmm_vm_name }}' not found in SCVMM"
      }
      $vmNetwork = Get-SCVMNetwork -Name '{{ scvmm_vm_network_name }}'
      if (-not $vmNetwork) {
          throw "VM Network '{{ scvmm_vm_network_name }}' not found - run the vm_network role first"
      }

      $adapters = @(Get-SCVirtualNetworkAdapter -VM $vm)
      {% if scvmm_vm_network_adapter_name | default('') | length > 0 %}
      $adapter = $adapters | Where-Object { $_.Name -eq '{{ scvmm_vm_network_adapter_name }}' } | Select-Object -First 1
      {% else %}
      $adapter = $adapters | Select-Object -First 1
      {% endif %}
      if (-not $adapter) {
          throw "No matching network adapter found on VM '{{ scvmm_vm_name }}'"
      }

      $alreadyAttached = ($adapter.VMNetwork -and $adapter.VMNetwork.Name -eq '{{ scvmm_vm_network_name }}')
      if (-not $alreadyAttached) {
          Set-SCVirtualNetworkAdapter -VirtualNetworkAdapter $adapter -VMNetwork $vmNetwork | Out-Null
      }

      [PSCustomObject]@{ Changed = (-not $alreadyAttached) } | ConvertTo-Json -Compress
  register: vm_network_adapter_result
  changed_when: (vm_network_adapter_result.stdout | trim | from_json).Changed

- name: Report the network adapter attachment
  when: scvmm_vm_name | default('') | length > 0
  vars:
    vm_network_adapter_parsed: "{{ vm_network_adapter_result.stdout | trim | from_json }}"
  ansible.builtin.debug:
    msg: >-
      '{{ scvmm_vm_name }}' network adapter
      {{ 'attached to' if vm_network_adapter_parsed.Changed else 'already attached to' }}
      VM Network '{{ scvmm_vm_network_name }}'.
