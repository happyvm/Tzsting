---
# Secrets must be provided through Ansible Vault or an AAP credential.

# --- Connection to a Windows host with the WSUS console/RSAT feature
# (and therefore the UpdateServices PowerShell module) installed -
# typically the WSUS server itself or an admin workstation. See README.
wsus_console_host: wsus01.example.local
wsus_conn_winrm_username: "{{ vault_wsus_conn_winrm_username }}"
wsus_conn_winrm_password: "{{ vault_wsus_conn_winrm_password }}"
wsus_conn_winrm_port: 5986
wsus_conn_winrm_transport: ntlm
wsus_conn_winrm_validate_certs: true

# --- WSUS server ---
wsus_server_name: wsus01.example.local
wsus_port_number: 8531
wsus_use_ssl: true

# add | audit - audit uses Add-WsusComputer's own native -WhatIf.
wsus_ga_operation: audit

# The exact FQDN as reported to WSUS - resolution is exact-match only,
# no partial/wildcard matching (see README).
wsus_ga_computer_name: ""
wsus_ga_target_group_name: ""

# WSUS's own client-side targeting (a GPO/registry setting on the
# client) can silently override a server-side group assignment the next
# time the client checks in. This project cannot reliably auto-detect
# whether client-side targeting is in effect - state it explicitly here
# so the risk is surfaced in the result. See README.
wsus_ga_client_side_targeting_enabled: false
