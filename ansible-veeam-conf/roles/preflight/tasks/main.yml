---
- name: Validate Veeam Backup & Replication configuration request
  ansible.builtin.assert:
    that:
      - veeam_conf_hostname | length > 0
      - veeam_conf_port > 0
      - veeam_conf_username | length > 0
      - veeam_conf_password | length > 0
      - veeam_conf_api_version | length > 0
      - not veeam_conf_email_notifications_enabled | bool or veeam_conf_email_notifications_endpoint is match('^/[^ ]+$')
      - not veeam_conf_snmp_enabled | bool or veeam_conf_snmp_endpoint is match('^/[^ ]+$')
    fail_msg: >-
      Credentials, the exact x-api-version header value for the target
      VBR release, and (when a notification channel is enabled)
      release-specific REST paths are all mandatory - copy them from the
      API guide/Swagger page for the target server. See README.
