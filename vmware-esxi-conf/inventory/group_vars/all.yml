---
# Secrets must be provided through Ansible Vault or an AAP credential.
esxi_conf_hostname: esxi01.example.local
esxi_conf_username: "{{ vault_esxi_conf_username }}"
esxi_conf_password: "{{ vault_esxi_conf_password }}"
esxi_conf_validate_certs: false

# community.vmware's host-scoped modules require esxi_hostname (the ESXi's
# own registered name) alongside the connection hostname - when connecting
# directly to a standalone host (no vCenter) these are normally the same
# value, but override if the host's registered name differs (short name vs
# FQDN, etc.).
esxi_conf_esxi_hostname: "{{ esxi_conf_hostname }}"

esxi_conf_ntp_servers:
  - ntp01.example.local
  - ntp02.example.local

# Remote syslog destination, ESXi Syslog.global.logHost format:
# proto://host:port (proto: udp, tcp or ssl).
esxi_conf_syslog_host: "tcp://syslog01.example.local:514"

# Disabled by default - joining an ESXi host to the wrong domain, or with a
# stale/incorrect payload, is not something to run unattended without
# review.
esxi_conf_ad_enabled: false
esxi_conf_ad:
  domain: example.local
  username: "{{ vault_esxi_conf_ad_username }}"
  password: "{{ vault_esxi_conf_ad_password }}"

esxi_conf_local_user:
  name: svc-ansible
  password: "{{ vault_esxi_conf_local_user_password }}"
  description: "Ansible automation account"

# Disabled by default. community.vmware.vmware_host_snmp only implements
# SNMP v1/v2c (community strings) - its own documentation states SNMP v3
# configuration isn't implemented yet. Use SNMPv3 elsewhere (vCenter/array/
# appliance conf projects) if this is a hard requirement for this host.
esxi_conf_snmp_enabled: false
esxi_conf_snmp:
  communities:
    - "{{ vault_esxi_conf_snmp_community | default('') }}"
  trap_targets:
    - hostname: snmp01.example.local
      port: 162
      community: "{{ vault_esxi_conf_snmp_community | default('') }}"
