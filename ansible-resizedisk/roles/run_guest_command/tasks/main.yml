---
# Runs a script string (PowerShell or bash, depending on resizedisk_guest_os)
# inside the guest OS, regardless of which channel preflight_connectivity
# picked, and normalizes the result into run_guest_command_result.stdout.
#
# Expects: `script`, resizedisk_guest_os (windows | linux) and
# resizedisk_exec_method (winrm | ssh | vmware_tools | powershell_direct)
# already set. vmware_tools branches internally on resizedisk_guest_os
# since the shell invocation differs (powershell.exe vs /bin/bash).

- name: Assert a script was provided
  ansible.builtin.assert:
    that: script is defined
    fail_msg: "run_guest_command requires a 'script' variable to be passed in."

- name: Run via WinRM
  when: resizedisk_exec_method == 'winrm'
  delegate_to: resizedisk_target
  ansible.windows.win_shell:
    cmd: "{{ script }}"
  changed_when: false
  register: run_guest_command_winrm

- name: Run via SSH
  when: resizedisk_exec_method == 'ssh'
  delegate_to: resizedisk_target
  ansible.builtin.shell:
    cmd: "{{ script }}"
    executable: /bin/bash
  changed_when: false
  failed_when: false  # non-zero exit is expected on guest-side errors; the
                       # calling role inspects stdout (RESIZEDISK_ERROR: ...)
                       # for a clean message instead of a raw shell failure.
  register: run_guest_command_ssh

- name: Run via VMware Tools guest operations (no network path to the guest needed)
  when: resizedisk_exec_method == 'vmware_tools'
  delegate_to: localhost
  vars:
    vmware_conn: &vmware_conn
      hostname: "{{ vcenter_hostname }}"
      username: "{{ vcenter_username }}"
      password: "{{ vcenter_password }}"
      datacenter: "{{ vcenter_datacenter }}"
      validate_certs: "{{ vmware_validate_certs }}"
    vmware_guest_conn: &vmware_guest_conn
      vm_id: "{{ vm_name }}"
      vm_username: "{{ guest_username }}"
      vm_password: "{{ guest_password }}"
    # Looked up by resizedisk_guest_os rather than built with an inline
    # Jinja ternary: a Windows path's backslashes, written as a Jinja
    # string literal inside an already-backslash-escaped YAML double
    # quoted string, double-unescape and break the template parser.
    run_guest_command_guest_tempdir:
      windows: "C:\\Windows\\Temp\\"
      linux: "/tmp/"
  block:
    - name: Generate a unique guest script/output filename for this invocation
      ansible.builtin.set_fact:
        run_guest_command_guest_script: "resizedisk_{{ 100000000 | random }}{{ '.ps1' if resizedisk_guest_os == 'windows' else '.sh' }}"
        run_guest_command_guest_output: "resizedisk_{{ 100000000 | random }}.out"

    - name: Write the script to a local temp file
      ansible.builtin.tempfile:
        suffix: "{{ '.ps1' if resizedisk_guest_os == 'windows' else '.sh' }}"
      register: run_guest_command_local_script

    - name: Populate the local temp file with the script content
      ansible.builtin.copy:
        dest: "{{ run_guest_command_local_script.path }}"
        content: "{{ script }}"
        mode: "0600"

    - name: Copy the script into the guest via VMware Tools (Windows)
      when: resizedisk_guest_os == 'windows'
      community.vmware.vmware_guest_file_operation:
        <<: [*vmware_conn, *vmware_guest_conn]
        copy:
          src: "{{ run_guest_command_local_script.path }}"
          dest: "C:\\Windows\\Temp\\{{ run_guest_command_guest_script }}"
          overwrite: true

    - name: Execute the script inside the guest via VMware Tools (Windows)
      when: resizedisk_guest_os == 'windows'
      community.vmware.vmware_vm_shell:
        <<: [*vmware_conn, *vmware_guest_conn]
        vm_shell: "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
        vm_shell_args: >-
          -NonInteractive -NoProfile -ExecutionPolicy Bypass
          -File "C:\Windows\Temp\{{ run_guest_command_guest_script }}"
          > "C:\Windows\Temp\{{ run_guest_command_guest_output }}" 2>&1
        wait_for_process: true

    - name: Clean up temporary files inside the guest (Windows)
      when: resizedisk_guest_os == 'windows'
      community.vmware.vmware_vm_shell:
        <<: [*vmware_conn, *vmware_guest_conn]
        vm_shell: "C:\\Windows\\System32\\cmd.exe"
        vm_shell_args: >-
          /c del "C:\Windows\Temp\{{ run_guest_command_guest_script }}"
          "C:\Windows\Temp\{{ run_guest_command_guest_output }}"
        wait_for_process: true
      ignore_errors: true

    - name: Copy the script into the guest via VMware Tools (Linux)
      when: resizedisk_guest_os == 'linux'
      community.vmware.vmware_guest_file_operation:
        <<: [*vmware_conn, *vmware_guest_conn]
        copy:
          src: "{{ run_guest_command_local_script.path }}"
          dest: "/tmp/{{ run_guest_command_guest_script }}"
          overwrite: true

    - name: Execute the script inside the guest via VMware Tools (Linux)
      when: resizedisk_guest_os == 'linux'
      community.vmware.vmware_vm_shell:
        <<: [*vmware_conn, *vmware_guest_conn]
        vm_shell: "/bin/bash"
        vm_shell_args: >-
          -c "bash '/tmp/{{ run_guest_command_guest_script }}' > '/tmp/{{ run_guest_command_guest_output }}' 2>&1"
        wait_for_process: true

    - name: Clean up temporary files inside the guest (Linux)
      when: resizedisk_guest_os == 'linux'
      community.vmware.vmware_vm_shell:
        <<: [*vmware_conn, *vmware_guest_conn]
        vm_shell: "/bin/rm"
        vm_shell_args: >-
          -f "/tmp/{{ run_guest_command_guest_script }}" "/tmp/{{ run_guest_command_guest_output }}"
        wait_for_process: true
      ignore_errors: true

    - name: Fetch the captured output back from the guest
      community.vmware.vmware_guest_file_operation:
        <<: [*vmware_conn, *vmware_guest_conn]
        fetch:
          src: "{{ run_guest_command_guest_tempdir[resizedisk_guest_os] }}{{ run_guest_command_guest_output }}"
          dest: "{{ run_guest_command_local_script.path }}.out"

    - name: Read the captured output
      ansible.builtin.set_fact:
        run_guest_command_vmwaretools_stdout: "{{ lookup('ansible.builtin.file', run_guest_command_local_script.path ~ '.out') }}"

    - name: Clean up local temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ run_guest_command_local_script.path }}"
        - "{{ run_guest_command_local_script.path }}.out"

- name: Run via Hyper-V PowerShell Direct (VMBus, no network path to the guest needed)
  when: resizedisk_exec_method == 'powershell_direct'
  delegate_to: "{{ resizedisk_hyperv_host }}"
  no_log: true
  ansible.windows.win_shell:
    cmd: |
      $ErrorActionPreference = "Stop"
      $securePassword = ConvertTo-SecureString -String @'
      {{ guest_password }}
      '@ -AsPlainText -Force
      $cred = New-Object System.Management.Automation.PSCredential('{{ guest_username }}', $securePassword)
      $scriptBlock = [scriptblock]::Create(@'
      {{ script }}
      '@)
      Invoke-Command -VMName '{{ vm_name }}' -Credential $cred -ScriptBlock $scriptBlock
  changed_when: false
  register: run_guest_command_psdirect

- name: Normalize the command result across channels
  ansible.builtin.set_fact:
    run_guest_command_result:
      stdout: >-
        {{
          (run_guest_command_winrm.stdout | default(''))
          ~ (run_guest_command_ssh.stdout | default(''))
          ~ (run_guest_command_vmwaretools_stdout | default(''))
          ~ (run_guest_command_psdirect.stdout | default(''))
        }}
