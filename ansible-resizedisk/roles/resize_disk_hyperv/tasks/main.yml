---
# Grows a VM's virtual hard disk (VHD/VHDX) on Hyper-V.
# Runs delegated to the Hyper-V host itself (WinRM): Hyper-V has no
# remote API comparable to vCenter's, disk management is local PowerShell.
#
# Note: online resize of an attached VHDX requires the disk to be on a
# SCSI controller (Generation 2 VM, or Generation 1 with SCSI-attached
# data disk). IDE-attached disks must be resized with the VM powered off.

- name: Assert required variables are defined
  ansible.builtin.assert:
    that:
      - resizedisk_hyperv_host is defined
      - vm_name is defined
      - disk_new_size_gb is defined
    fail_msg: >-
      resizedisk_hyperv_host, vm_name and disk_new_size_gb must all be set for
      resize_disk_hyperv (resizedisk_hyperv_host is normally resolved by the
      preflight_platform role).

- name: Locate the VHD/VHDX backing the target disk and gather resize-eligibility facts
  delegate_to: "{{ resizedisk_hyperv_host }}"
  ansible.windows.win_shell: |
    $ErrorActionPreference = "Stop"
    $drive = Get-VM -Name '{{ vm_name }}' | Get-VMHardDiskDrive | Select-Object -Index {{ disk_number_hyperv }}
    if (-not $drive) {
        throw "No VMHardDiskDrive found at index {{ disk_number_hyperv }} for VM '{{ vm_name }}'"
    }
    $isPassthrough = [string]::IsNullOrEmpty($drive.Path)
    $vhd = $null
    if (-not $isPassthrough) {
        $vhd = Get-VHD -Path $drive.Path
    }
    $checkpointCount = (Get-VMSnapshot -VMName '{{ vm_name }}' -ErrorAction SilentlyContinue | Measure-Object).Count
    [PSCustomObject]@{
        Path            = $drive.Path
        ControllerType  = $drive.ControllerType
        IsPassthrough   = $isPassthrough
        SharedVhdx      = [bool]$drive.SupportPersistentReservations
        CheckpointCount = $checkpointCount
        VhdType         = if ($vhd) { $vhd.VhdType.ToString() } else { $null }
        SizeBytes       = if ($vhd) { $vhd.Size } else { $null }
    } | ConvertTo-Json -Compress
  changed_when: false
  register: hyperv_disk_lookup

- name: Parse current disk info
  ansible.builtin.set_fact:
    hyperv_vhd_info: "{{ hyperv_disk_lookup.stdout | from_json }}"

# --- Resize-blocking conditions -------------------------------------------
# Resize-VHD only operates on VHD/VHDX files: it cannot touch a physical
# disk attached in pass-through mode, a shared VHDX used for guest
# clustering (SupportPersistentReservations), or a disk that's part of a
# checkpoint/differencing chain (resizing the wrong member of the chain
# silently produces an inconsistent disk).

- name: Refuse to resize a pass-through (physical) disk
  ansible.builtin.assert:
    that:
      - not hyperv_vhd_info.IsPassthrough
    fail_msg: >-
      The disk at index {{ disk_number_hyperv }} on '{{ vm_name }}' is a
      pass-through (physical) disk, not a VHD/VHDX. It must be grown at
      the storage/LUN level and rescanned in the guest, not resized here.

- name: Refuse to resize a shared VHDX
  ansible.builtin.assert:
    that:
      - not hyperv_vhd_info.SharedVhdx
    fail_msg: >-
      {{ hyperv_vhd_info.Path }} on '{{ vm_name }}' is a shared VHDX
      (SupportPersistentReservations), used for guest clustering. Resize
      requires coordinating all cluster nodes / removing sharing first -
      refusing to proceed automatically.

- name: Refuse to resize while checkpoints exist
  ansible.builtin.assert:
    that:
      - hyperv_vhd_info.CheckpointCount == 0
    fail_msg: >-
      '{{ vm_name }}' has {{ hyperv_vhd_info.CheckpointCount }} checkpoint(s).
      Hyper-V does not support resizing a VHDX with checkpoints - remove or
      merge them first.

- name: Refuse to resize a differencing disk directly
  ansible.builtin.assert:
    that:
      - hyperv_vhd_info.VhdType != 'Differencing'
    fail_msg: >-
      {{ hyperv_vhd_info.Path }} on '{{ vm_name }}' is a differencing disk
      (part of a parent/child chain). Resize the base disk after merging
      the chain, not the differencing disk directly.

- name: Refuse to shrink or no-op the disk
  ansible.builtin.assert:
    that:
      - (disk_new_size_gb | int) >= ((hyperv_vhd_info.SizeBytes | int / 1073741824) | round(0, 'ceil') | int) + (resizedisk_min_growth_gb | int)
    fail_msg: >-
      Requested size {{ disk_new_size_gb }}GB is not at least
      {{ resizedisk_min_growth_gb }}GB larger than the current disk size
      ({{ (hyperv_vhd_info.SizeBytes | int / 1073741824) | round(2) }}GB). Refusing to shrink/no-op.

- name: Grow the virtual hard disk to the requested size
  delegate_to: "{{ resizedisk_hyperv_host }}"
  ansible.windows.win_shell: |
    $ErrorActionPreference = "Stop"
    Resize-VHD -Path '{{ hyperv_vhd_info.Path }}' -SizeBytes {{ (disk_new_size_gb | int) * 1073741824 }}
  register: hyperv_resize_result

- name: Report new disk size
  ansible.builtin.debug:
    msg: >-
      Disk {{ hyperv_vhd_info.Path }} on {{ vm_name }} resized to {{ disk_new_size_gb }}GB.
