---
# Grows a VM's virtual disk on VMware (vSphere/ESXi) via the vCenter API.
# Runs delegated to localhost: the module talks to vCenter over HTTPS,
# it does not need to touch the guest OS.

- name: Assert required variables are defined
  ansible.builtin.assert:
    that:
      - vcenter_hostname is defined
      - vcenter_username is defined
      - vcenter_password is defined
      - vcenter_datacenter is defined
      - vm_name is defined
      - disk_new_size_gb is defined
    fail_msg: >-
      vcenter_hostname, vcenter_username, vcenter_password, vcenter_datacenter,
      vm_name and disk_new_size_gb must all be set for resize_disk_vmware.

- name: Look up the current size of the target disk
  delegate_to: localhost
  community.vmware.vmware_guest_disk_info:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    datacenter: "{{ vcenter_datacenter }}"
    validate_certs: "{{ vmware_validate_certs }}"
    name: "{{ vm_name }}"
  register: vmware_disk_info

- name: Determine the disk matching the requested controller/unit number
  ansible.builtin.set_fact:
    vmware_target_disk: "{{ vmware_disk_info.guest_disk_info.values()
                             | selectattr('controller_number', 'equalto', disk_controller_number)
                             | selectattr('unit_number', 'equalto', disk_unit_number)
                             | first }}"

- name: Refuse to shrink or no-op the disk
  ansible.builtin.assert:
    that:
      - (disk_new_size_gb | int) >= ((vmware_target_disk.capacity_in_kb | int / 1024 / 1024) | round(0, 'ceil') | int) + (resizedisk_min_growth_gb | int)
    fail_msg: >-
      Requested size {{ disk_new_size_gb }}GB is not at least
      {{ resizedisk_min_growth_gb }}GB larger than the current disk size
      ({{ (vmware_target_disk.capacity_in_kb | int / 1024 / 1024) | round(2) }}GB). Refusing to shrink/no-op.

- name: Grow the virtual disk to the requested size
  delegate_to: localhost
  community.vmware.vmware_guest_disk:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    datacenter: "{{ vcenter_datacenter }}"
    validate_certs: "{{ vmware_validate_certs }}"
    name: "{{ vm_name }}"
    disk:
      - size_gb: "{{ disk_new_size_gb }}"
        state: present
        controller_type: "{{ disk_controller_type }}"
        controller_number: "{{ disk_controller_number }}"
        unit_number: "{{ disk_unit_number }}"
  register: vmware_resize_result

- name: Report new disk size
  ansible.builtin.debug:
    msg: >-
      Disk (controller {{ disk_controller_number }}, unit {{ disk_unit_number }})
      on {{ vm_name }} resized to {{ disk_new_size_gb }}GB.
