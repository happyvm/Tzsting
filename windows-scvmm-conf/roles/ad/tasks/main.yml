---
# Joins the SCVMM management server to Active Directory. Deliberately never
# reboots the host itself (-Restart is not used): the restart needed to
# complete a domain join is a deliberately-scheduled maintenance action -
# SCVMM being unavailable mid-restart affects every Hyper-V host it
# manages, so this must not be triggered unattended from a config
# playbook. The join is idempotent: already being a member of the
# requested domain is left alone.
- name: Join the SCVMM management server to Active Directory
  delegate_to: scvmm_conf_target
  no_log: true
  ansible.windows.win_shell:
    cmd: |
      $ErrorActionPreference = "Stop"
      $cs = Get-CimInstance Win32_ComputerSystem
      if ($cs.PartOfDomain -and $cs.Domain -eq '{{ scvmm_conf_ad.domain }}') {
          [PSCustomObject]@{ Joined = $false; AlreadyMember = $true } | ConvertTo-Json -Compress
      } else {
          $securePassword = ConvertTo-SecureString -String @'
      {{ scvmm_conf_ad.password }}
      '@ -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential('{{ scvmm_conf_ad.username }}', $securePassword)
          $params = @{
              DomainName = '{{ scvmm_conf_ad.domain }}'
              Credential = $cred
              Restart    = $false
              Force      = $true
          }
          {% if scvmm_conf_ad.ou | default('') | length > 0 %}
          $params['OUPath'] = '{{ scvmm_conf_ad.ou }}'
          {% endif %}
          Add-Computer @params | Out-Null
          [PSCustomObject]@{ Joined = $true; AlreadyMember = $false } | ConvertTo-Json -Compress
      }
  register: ad_result
  changed_when: (ad_result.stdout | trim | from_json).Joined

- name: Report the domain join
  vars:
    ad_parsed: "{{ ad_result.stdout | trim | from_json }}"
  ansible.builtin.debug:
    msg: >-
      {{ scvmm_conf_hostname }}
      {{ 'was already a member of ' + scvmm_conf_ad.domain if ad_parsed.AlreadyMember
         else 'joined ' + scvmm_conf_ad.domain + ' - a restart is required to complete the join, schedule it separately.' }}
