---
- name: Validate SCVMM management server configuration request
  ansible.builtin.assert:
    that:
      - scvmm_conf_hostname | length > 0
      - scvmm_conf_username | length > 0
      - scvmm_conf_password | length > 0
      - scvmm_conf_ntp_servers | length > 0
      - scvmm_conf_timezone | length > 0
      - scvmm_conf_local_admin.name is match('^[A-Za-z0-9._-]+$')
      - scvmm_conf_local_admin.password | length >= 8
      - not scvmm_conf_ad_enabled | bool or scvmm_conf_ad.domain | length > 0
      - not scvmm_conf_ad_enabled | bool or scvmm_conf_ad.username | length > 0
      - not scvmm_conf_ad_enabled | bool or scvmm_conf_ad.password | length > 0
    fail_msg: >-
      scvmm_conf_hostname/username/password, NTP servers, timezone and a
      valid local automation account are required; enabling AD also
      requires a domain, username and password.
