---
# Best-effort per-VM lock so two ServiceNow-triggered runs against the
# same vm_name don't race each other - especially important here since
# both decommission_stop and delete_vm power off (and delete_vm
# additionally removes) the VM. Called twice from each playbook: once
# with deletevm_lock_action=acquire right after preflight_platform, and
# once with deletevm_lock_action=release in an `always:` block wrapping
# everything else, so the lock is freed on both success and failure.
#
# Deliberately its own namespace/marker (DELETEVM_LOCK / C:\ProgramData\
# ansible-deletevm\) rather than sharing another project's lock - none
# of these projects coordinate with each other. Running a resize/
# snapshot operation and a delete against the same VM at the same time
# is still the operator's responsibility to avoid.
#
# The two platforms get genuinely different guarantees:
#   - Hyper-V: a lock file created with FileMode.CreateNew on the
#     owning Hyper-V host. This IS atomic (the OS refuses a second
#     exclusive create), so this is a real mutual-exclusion lock, not
#     just advisory.
#   - VMware: a marker written into the VM's annotation field via a
#     read-then-write vCenter API call. This has no compare-and-swap, so
#     two runs starting within the same read-write window could both
#     believe they acquired it - it narrows the race a lot (covers the
#     common "double-clicked submit" case) but isn't airtight. There's no
#     vCenter API available to this playbook that offers true atomic
#     locking on an arbitrary VM field.

- name: Assert deletevm_lock_action is valid
  ansible.builtin.assert:
    that:
      - deletevm_lock_action in ['acquire', 'release']
    fail_msg: "deletevm_lock_action must be 'acquire' or 'release'."

- name: Determine a run identifier for the lock marker
  ansible.builtin.set_fact:
    deletevm_lock_run_id: "{{ deletevm_lock_run_id | default(lookup('pipe', 'date -u +%s') ~ '-' ~ (999999 | random)) }}"

# --- VMware --------------------------------------------------------------

- name: (VMware) Read the current annotation
  when: deletevm_hypervisor_type == 'vmware'
  delegate_to: localhost
  community.vmware.vmware_guest_info:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    datacenter: "{{ vcenter_datacenter }}"
    validate_certs: "{{ vmware_validate_certs }}"
    name: "{{ vm_name }}"
  register: deletevm_lock_vmware_read

- name: (VMware) Parse an existing lock marker, if any
  when: deletevm_hypervisor_type == 'vmware'
  ansible.builtin.set_fact:
    deletevm_lock_vmware_match: "{{ (deletevm_lock_vmware_read.instance.annotation | default(''))
                                     | regex_search('DELETEVM_LOCK:(\\d+):(\\S+)', '\\1', '\\2') }}"
    deletevm_lock_now_epoch: "{{ lookup('pipe', 'date -u +%s') }}"

- name: (VMware) Refuse to acquire while a non-stale lock is held by another run
  when:
    - deletevm_hypervisor_type == 'vmware'
    - deletevm_lock_action == 'acquire'
    - deletevm_lock_vmware_match is not none
    - (deletevm_lock_now_epoch | int) - (deletevm_lock_vmware_match[0] | int) < (deletevm_lock_timeout_seconds | int)
  ansible.builtin.fail:
    msg: >-
      '{{ vm_name }}' already has an active deletevm lock (run
      {{ deletevm_lock_vmware_match[1] }}, acquired
      {{ (deletevm_lock_now_epoch | int) - (deletevm_lock_vmware_match[0] | int) }}s ago).
      Another decommission/deletion looks to be in progress - wait for it
      to finish, or investigate if it's stuck (locks self-expire after
      {{ deletevm_lock_timeout_seconds }}s).

- name: (VMware) Write the updated annotation (lock added or removed)
  # On release, only touch the annotation if the current marker is ours
  # (or absent) - otherwise it belongs to a run that broke our stale lock
  # and re-acquired since, and blanking it here would reopen the race
  # this lock exists to prevent.
  when:
    - deletevm_hypervisor_type == 'vmware'
    - deletevm_lock_action == 'acquire' or deletevm_lock_vmware_match is none or deletevm_lock_vmware_match[1] == deletevm_lock_run_id
  delegate_to: localhost
  community.vmware.vmware_guest:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    datacenter: "{{ vcenter_datacenter }}"
    validate_certs: "{{ vmware_validate_certs }}"
    name: "{{ vm_name }}"
    annotation: >-
      {{
        (
          (deletevm_lock_vmware_read.instance.annotation | default(''))
          | regex_replace('\n?DELETEVM_LOCK:\d+:\S+', '')
        )
        ~ ('\nDELETEVM_LOCK:' ~ deletevm_lock_now_epoch ~ ':' ~ deletevm_lock_run_id if deletevm_lock_action == 'acquire' else '')
      }}
  ignore_errors: "{{ deletevm_lock_action == 'release' }}"  # best-effort on release: a failed cleanup just leaves a lock that self-expires

# --- Hyper-V ---------------------------------------------------------------

- name: (Hyper-V) Acquire or release the lock file on the owning host
  when: deletevm_hypervisor_type == 'hyperv'
  delegate_to: "{{ deletevm_hyperv_host | default('localhost', true) }}"
  ansible.windows.win_shell:
    cmd: |
      $ErrorActionPreference = "Stop"
      $lockDir = "C:\ProgramData\ansible-deletevm"
      $lockPath = Join-Path $lockDir "{{ vm_name }}.lock"
      if (-not (Test-Path $lockDir)) { New-Item -ItemType Directory -Path $lockDir -Force | Out-Null }

      if ('{{ deletevm_lock_action }}' -eq 'release') {
          # Only remove the lock if it still holds *our* run id - if it was
          # broken as stale by another run and re-acquired, the holder is
          # someone else's active lock now, and deleting it would reopen
          # the race this lock exists to prevent.
          $currentHolder = if (Test-Path $lockPath) { Get-Content $lockPath -Raw -ErrorAction SilentlyContinue } else { $null }
          if ($currentHolder -eq '{{ deletevm_lock_run_id }}') {
              Remove-Item -Path $lockPath -Force -ErrorAction SilentlyContinue
              "RELEASED"
          } else {
              "SKIPPED:not our lock"
          }
          exit 0
      }

      if (Test-Path $lockPath) {
          $ageSeconds = [int]((Get-Date).ToUniversalTime() - (Get-Item $lockPath).LastWriteTimeUtc).TotalSeconds
          if ($ageSeconds -lt {{ deletevm_lock_timeout_seconds }}) {
              $holder = Get-Content $lockPath -Raw -ErrorAction SilentlyContinue
              "LOCKED:$ageSeconds`:$holder"
              exit 0
          }
          Remove-Item -Path $lockPath -Force -ErrorAction SilentlyContinue  # stale, break it
      }

      try {
          $fs = [System.IO.File]::Open($lockPath, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write)
          $writer = New-Object System.IO.StreamWriter($fs)
          $writer.Write("{{ deletevm_lock_run_id }}")
          $writer.Close()
          $fs.Close()
          "ACQUIRED"
      } catch [System.IO.IOException] {
          "LOCKED:race"
      }
  changed_when: false
  register: deletevm_lock_hyperv_result

- name: (Hyper-V) Refuse to acquire while a lock is held by another run
  when:
    - deletevm_hypervisor_type == 'hyperv'
    - deletevm_lock_action == 'acquire'
    - deletevm_lock_hyperv_result.stdout is defined
    - deletevm_lock_hyperv_result.stdout is search('^LOCKED')
  ansible.builtin.fail:
    msg: >-
      '{{ vm_name }}' already has an active deletevm lock on
      {{ deletevm_hyperv_host }} ({{ deletevm_lock_hyperv_result.stdout | trim }}).
      Another decommission/deletion looks to be in progress - wait for it
      to finish, or investigate if it's stuck (locks self-expire after
      {{ deletevm_lock_timeout_seconds }}s).
