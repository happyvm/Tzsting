---
# Gracefully stops the VM (if running) and records a decommission marker
# in its Notes field (preserving any existing content) - does not delete
# anything. Re-running this simply updates the marker.
#
# Marker format: DECOMMISSION_SCHEDULED:<date>:<servicenow_ticket>:<was_running>:<reason>
# <was_running> records the VM's power state *before* this run touches
# it, so decommission_cancel.yml can restore exactly that state later
# rather than unconditionally powering the VM back on.

- name: Assert required variables/facts are defined
  ansible.builtin.assert:
    that:
      - vm_name is defined
      - deletevm_hyperv_host is defined
      - vm_delete_scheduled_at is defined
      - servicenow_ticket is defined
      - deletevm_was_running is defined

- name: Gracefully stop the VM and record the decommission marker
  delegate_to: "{{ deletevm_hyperv_host }}"
  ansible.windows.win_shell:
    cmd: |
      $ErrorActionPreference = "Stop"
      $timeoutSeconds = {{ deletevm_poweroff_timeout_seconds }}

      $vm = Get-VM -Name '{{ vm_name }}'
      if ($vm.State -eq 'Running') {
          Stop-VM -Name '{{ vm_name }}'
          $waited = 0
          while ((Get-VM -Name '{{ vm_name }}').State -ne 'Off' -and $waited -lt $timeoutSeconds) {
              Start-Sleep -Seconds 5
              $waited += 5
          }
      }

      $currentNotes = (Get-VM -Name '{{ vm_name }}').Notes
      if (-not $currentNotes) { $currentNotes = "" }
      $currentNotes = $currentNotes -replace '\n?DECOMMISSION_SCHEDULED:\S+:.*', ''
      $newNotes = $currentNotes + "`nDECOMMISSION_SCHEDULED:{{ vm_delete_scheduled_at }}:{{ servicenow_ticket }}:{{ deletevm_was_running }}:{{ decommission_reason | default('no reason given') }}"
      Set-VM -Name '{{ vm_name }}' -Notes $newNotes

      [PSCustomObject]@{
          FinalState = (Get-VM -Name '{{ vm_name }}').State.ToString()
      } | ConvertTo-Json -Compress
  register: decommission_stop_result

- name: Report the decommission
  ansible.builtin.debug:
    msg: >-
      '{{ vm_name }}' stopped (final state:
      {{ (decommission_stop_result.stdout | trim | from_json).FinalState }})
      and marked for deletion on {{ vm_delete_scheduled_at }} (ticket
      {{ servicenow_ticket }}). Run delete_vm.yml against the same
      vm_name when that window opens to actually remove it, or
      decommission_cancel.yml to bring it back into service instead.
