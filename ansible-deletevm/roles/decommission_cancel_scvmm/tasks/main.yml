---
# Removes the decommission marker from the VM's SCVMM Description field
# (preserving any other content) and restores it to the power state it
# was in before decommission_stop ran.

- name: Assert required variables/facts are defined
  ansible.builtin.assert:
    that:
      - scvmm_server is defined
      - scvmm_server | length > 0
      - vm_name is defined
      - deletevm_cancel_raw_field is defined
      - deletevm_cancel_was_running is defined

- name: Remove the marker and restore the prior power state via SCVMM
  delegate_to: "{{ scvmm_server }}"
  ansible.windows.win_shell:
    cmd: |
      $ErrorActionPreference = "Stop"
      Import-Module virtualmachinemanager -ErrorAction SilentlyContinue
      Get-SCVMMServer -ComputerName '{{ scvmm_server }}' | Out-Null

      $vm = Get-SCVirtualMachine -Name '{{ vm_name }}'
      if (-not $vm) {
          throw "VM '{{ vm_name }}' not found in SCVMM"
      }

      # deletevm_cancel_raw_field is pre-existing, unvalidated free-text
      # Description content - a here-string is safe against that the
      # same way it's used elsewhere in this project for arbitrary
      # passwords (see decommission_cancel_hyperv for the full reasoning).
      $newDescription = @'
      {{ deletevm_cancel_raw_field | regex_replace("\n?DECOMMISSION_SCHEDULED:\S+:.*", "") }}
      '@
      Set-SCVirtualMachine -VM $vm -Description $newDescription | Out-Null

      if ('{{ deletevm_cancel_was_running }}' -eq 'True') {
          Start-SCVirtualMachine -VM $vm | Out-Null
      }

      [PSCustomObject]@{
          FinalState = (Get-SCVirtualMachine -Name '{{ vm_name }}').Status.ToString()
      } | ConvertTo-Json -Compress
  register: decommission_cancel_result

- name: Report the cancellation
  ansible.builtin.debug:
    msg: >-
      '{{ vm_name }}' decommission cancelled via SCVMM - marker removed
      (final state: {{ (decommission_cancel_result.stdout | trim | from_json).FinalState }}).
