---
# Refuses to delete a VM that has no valid, recent backup.
#
# ANSIBLE.md is explicit that a snapshot is not a backup, and the delete
# path is the one place where being wrong is unrecoverable: once
# delete_vm_vmware/hyperv/scvmm has run, the disks are gone. This role is
# the check that has to pass before that happens.
#
# It is read-only against the backup server: it authenticates, asks for
# the VM's restore points, and evaluates them. It never creates, deletes
# or triggers a backup.
#
# It fails closed. With deletevm_backup_verification_enabled left true
# and nothing configured, the run stops - a missing configuration must
# not read as "no backup needed". Skipping is possible but has to be
# deliberate (deletevm_backup_verification_enabled=false) or explicitly
# waived per run (deletevm_backup_allow_missing=true), and both land in
# the AAP artifact so the decision is auditable.
#
# Like the appliance projects, the release-specific parts - endpoint,
# header value, response field names - come from a contract table keyed
# by the backup server's release, because they change between releases
# and guessing them would mean reading the wrong field and concluding
# "backed up" from a response that says nothing of the sort.

- name: Note that backup verification was skipped by configuration
  when: not (deletevm_backup_verification_enabled | bool)
  ansible.builtin.set_fact:
    deletevm_backup_state: disabled
    deletevm_backup_detail: >-
      Backup verification is switched off
      (deletevm_backup_verification_enabled=false).

- name: Verify a valid backup exists before deleting
  when: deletevm_backup_verification_enabled | bool
  block:

    - name: Assert the backup provider and release are configured
      ansible.builtin.assert:
        that:
          - deletevm_backup_provider in ['veeam', 'netbackup']
          - deletevm_backup_release | default('') | length > 0
          - deletevm_backup_release is regex('^[0-9]+\\.[0-9]+(\\.[0-9A-Za-z.-]+)?$')
          - deletevm_backup_hostname | default('') | length > 0
        fail_msg: >-
          Backup verification is enabled but not configured:
          deletevm_backup_provider must be 'veeam' or 'netbackup',
          deletevm_backup_release must be the backup server's release
          (e.g. 12.1), and deletevm_backup_hostname must point at it.
          Configure them, or switch the check off deliberately with
          -e deletevm_backup_verification_enabled=false - it is left on by
          default because deleting a VM is not reversible.

    - name: Derive the contract branch from the backup server release
      ansible.builtin.set_fact:
        deletevm_backup_branch: "{{ deletevm_backup_release.split('.')[0:2] | join('.') }}"

    - name: Assert a contract is declared for this provider and branch
      ansible.builtin.assert:
        that:
          - deletevm_backup_provider in deletevm_backup_api_contracts
          - deletevm_backup_branch in deletevm_backup_api_contracts[deletevm_backup_provider]
        fail_msg: >-
          No backup API contract is declared for {{ deletevm_backup_provider }}
          branch {{ deletevm_backup_branch }}. Known branches for this
          provider:
          {{ deletevm_backup_api_contracts[deletevm_backup_provider] | default({}) | list | sort | join(', ') | default('none', true) }}.
          Add it to deletevm_backup_api_contracts with the values from that
          release's API reference - pointing this at a neighbouring branch
          risks reading a field that does not mean what it used to.

    - name: Select the contract
      ansible.builtin.set_fact:
        deletevm_backup_contract: "{{ deletevm_backup_api_contracts[deletevm_backup_provider][deletevm_backup_branch] }}"

    - name: Assert the contract is complete enough to interpret a response
      ansible.builtin.assert:
        that:
          - deletevm_backup_contract.restore_points_endpoint | default('') is match('^/[^ ]+$')
          - deletevm_backup_contract.timestamp_field | default('') | length > 0
          - deletevm_backup_contract.success_values | default([]) | length > 0
        fail_msg: >-
          The {{ deletevm_backup_provider }} {{ deletevm_backup_branch }}
          contract is incomplete. It needs restore_points_endpoint (an
          absolute path), timestamp_field and status_field (the response
          fields carrying the restore point's date and outcome) and
          success_values (the outcomes that count as a usable backup).
          Without them this role cannot tell a successful backup from a
          failed one.

    # --- authenticate ------------------------------------------------------
    # Both flows are the ones ansible-veeam-conf and ansible-netbackup-conf
    # already use against these products: VBR takes an OAuth2 password
    # grant, NetBackup a JWT login carrying its versioned media type.

    - name: Request a Veeam VBR access token
      when: deletevm_backup_provider == 'veeam'
      ansible.builtin.uri:
        url: "https://{{ deletevm_backup_hostname }}:{{ deletevm_backup_port }}/api/oauth2/token"
        method: POST
        headers:
          x-api-version: "{{ deletevm_backup_contract.api_version_header }}"
        body_format: form-urlencoded
        body:
          grant_type: password
          username: "{{ deletevm_backup_username }}"
          password: "{{ deletevm_backup_password }}"
        validate_certs: "{{ deletevm_backup_validate_certs }}"
        status_code: [200]
      register: deletevm_backup_veeam_auth
      no_log: true

    - name: Log in to the NetBackup REST API
      when: deletevm_backup_provider == 'netbackup'
      ansible.builtin.uri:
        url: "https://{{ deletevm_backup_hostname }}:{{ deletevm_backup_port }}{{ deletevm_backup_contract.login_endpoint }}"
        method: POST
        headers:
          Content-Type: "{{ deletevm_backup_contract.media_type }}"
          Accept: "{{ deletevm_backup_contract.media_type }}"
        body_format: json
        body:
          userName: "{{ deletevm_backup_username }}"
          password: "{{ deletevm_backup_password }}"
          domainName: "{{ deletevm_backup_domain_name | default(omit, true) }}"
          domainType: "{{ deletevm_backup_domain_type | default(omit, true) }}"
        validate_certs: "{{ deletevm_backup_validate_certs }}"
        status_code: [200, 201]
      register: deletevm_backup_netbackup_auth
      no_log: true

    - name: Build the authenticated request headers
      no_log: true
      ansible.builtin.set_fact:
        deletevm_backup_headers: >-
          {{
            {'Authorization': 'Bearer ' ~ deletevm_backup_veeam_auth.json.access_token,
             'x-api-version': deletevm_backup_contract.api_version_header,
             'Accept': 'application/json'}
            if deletevm_backup_provider == 'veeam'
            else {'Authorization': 'Bearer ' ~ deletevm_backup_netbackup_auth.json.token,
                  'Accept': deletevm_backup_contract.media_type}
          }}

    # --- query -------------------------------------------------------------

    # Built separately so the query stays readable: the optional
    # name_query_parameter lets a release filter server-side (e.g.
    # "?nameFilter="), and the VM name is only appended when one is declared.
    - name: Build the restore-point query URL
      ansible.builtin.set_fact:
        deletevm_backup_url: >-
          https://{{ deletevm_backup_hostname }}:{{ deletevm_backup_port }}{{ deletevm_backup_contract.restore_points_endpoint }}
          {%- set filter = deletevm_backup_contract.name_query_parameter | default('') -%}
          {{ filter ~ (vm_name | urlencode) if filter | length > 0 else '' }}

    - name: Ask the backup server for this VM's restore points
      ansible.builtin.uri:
        url: "{{ deletevm_backup_url }}"
        method: GET
        headers: "{{ deletevm_backup_headers }}"
        validate_certs: "{{ deletevm_backup_validate_certs }}"
        status_code: [200]
      register: deletevm_backup_query
      changed_when: false

    # The list can sit at the top level of the response or under a single
    # wrapper key, which is what results_key names. Anything deeper would
    # be a different contract, not a variation of this one.
    - name: Extract the restore point list from the response
      ansible.builtin.set_fact:
        deletevm_backup_points: >-
          {{
            deletevm_backup_query.json[deletevm_backup_contract.results_key]
            if (deletevm_backup_contract.results_key | default('')) | length > 0
            else deletevm_backup_query.json
          }}

    # The endpoint may return every VM's points, so filter by name here
    # rather than trusting the query parameter to have done it. Comparing
    # case-insensitively: vCenter and the backup catalogue disagree on case
    # more often than they disagree on the name.
    - name: Keep only this VM's restore points
      ansible.builtin.set_fact:
        deletevm_backup_own_points: >-
          {{
            deletevm_backup_points
            | selectattr(deletevm_backup_contract.name_field, 'defined')
            | selectattr(deletevm_backup_contract.name_field, 'equalto', vm_name)
            | list
            if (deletevm_backup_contract.name_field | default('')) | length > 0
            else deletevm_backup_points
          }}

    - name: Keep only the restore points that actually succeeded
      ansible.builtin.set_fact:
        deletevm_backup_good_points: >-
          {{
            deletevm_backup_own_points
            | selectattr(deletevm_backup_contract.status_field, 'defined')
            | selectattr(deletevm_backup_contract.status_field, 'in', deletevm_backup_contract.success_values)
            | list
            if (deletevm_backup_contract.status_field | default('')) | length > 0
            else deletevm_backup_own_points
          }}

    # --- evaluate ----------------------------------------------------------

    - name: Determine the most recent successful restore point
      ansible.builtin.set_fact:
        deletevm_backup_latest: >-
          {{
            (deletevm_backup_good_points
             | sort(attribute=deletevm_backup_contract.timestamp_field)
             | last)[deletevm_backup_contract.timestamp_field]
            if deletevm_backup_good_points | length > 0 else ''
          }}

    # Fractional seconds and a trailing Z or +00:00 are dropped before
    # parsing: they vary between releases of the same product and carry no
    # information this check needs, which only compares whole seconds.
    #
    # Single backslash in the regex, not double: inside a folded scalar the
    # pattern reaches the regex engine as written, so '\\.' would match a
    # literal backslash and quietly leave the fractional part in place -
    # to_datetime then fails on the leftover. (In the plain scalars used by
    # the assert tasks above, both spellings resolve the same; here they do
    # not.)
    - name: Compute the age of that restore point
      when: deletevm_backup_latest | length > 0
      ansible.builtin.set_fact:
        deletevm_backup_age_hours: >-
          {{
            (
              (now(utc=true).strftime('%s') | int)
              - ((deletevm_backup_latest | regex_replace('\.[0-9]+', '') | regex_replace('(Z|[+-][0-9]{2}:?[0-9]{2})$', ''))
                 | to_datetime('%Y-%m-%dT%H:%M:%S')).strftime('%s') | int
            ) / 3600
          }}

    - name: Refuse to delete a VM with no usable backup
      when:
        - deletevm_backup_good_points | length == 0
        - not (deletevm_backup_allow_missing | bool)
      ansible.builtin.fail:
        msg: >-
          '{{ vm_name }}' has no successful restore point on
          {{ deletevm_backup_hostname }} ({{ deletevm_backup_provider }}
          {{ deletevm_backup_release }}), out of
          {{ deletevm_backup_own_points | length }} restore point(s) found
          for it. Deleting it would destroy the only copy of its data.
          Take a backup first, or - if this VM is genuinely not meant to be
          backed up - waive the check for this run with
          -e deletevm_backup_allow_missing=true, which is recorded in the
          job artifact.

    - name: Refuse to delete a VM whose newest backup is too old
      when:
        - deletevm_backup_good_points | length > 0
        - (deletevm_backup_age_hours | float) > (deletevm_backup_max_age_hours | float)
        - not (deletevm_backup_allow_missing | bool)
      ansible.builtin.fail:
        msg: >-
          The newest successful backup of '{{ vm_name }}' is
          {{ deletevm_backup_age_hours | float | round(1) }}h old
          ({{ deletevm_backup_latest }}), past the
          {{ deletevm_backup_max_age_hours }}h limit. Anything written to
          the VM since then would be lost for good. Run a fresh backup,
          raise deletevm_backup_max_age_hours deliberately if this VM's
          protection schedule is genuinely slower, or waive the check with
          -e deletevm_backup_allow_missing=true.

    - name: Record the verification outcome
      ansible.builtin.set_fact:
        deletevm_backup_state: >-
          {{ 'waived' if (deletevm_backup_allow_missing | bool) and deletevm_backup_good_points | length == 0
             else ('stale-waived' if (deletevm_backup_allow_missing | bool) and (deletevm_backup_age_hours | default(0) | float) > (deletevm_backup_max_age_hours | float)
             else 'verified') }}
        deletevm_backup_detail: >-
          {{ deletevm_backup_good_points | length }} successful restore point(s);
          newest {{ deletevm_backup_latest | default('none', true) }}
          ({{ (deletevm_backup_age_hours | default(0) | float) | round(1) }}h old).

    - name: Report the verification outcome
      ansible.builtin.debug:
        msg: >-
          Backup check for '{{ vm_name }}': {{ deletevm_backup_state }} -
          {{ deletevm_backup_detail }}
