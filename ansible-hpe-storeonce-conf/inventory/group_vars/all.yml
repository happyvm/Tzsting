---
storeonce_hostname: storeonce01.example.local
storeonce_validate_certs: true
storeonce_api_username: "{{ vault_storeonce_api_username }}"
storeonce_api_password: "{{ vault_storeonce_api_password }}"
storeonce_api_headers:
  Accept: application/json
  Content-Type: application/json

# --- Release-specific REST contract -----------------------------------------
# StoreOnce REST resource paths, methods and features depend on the software
# branch and on appliance/federation mode. The branch an appliance runs is
# declared here (or per run with -e storeonce_release=...), and the api_contract
# role resolves it against the table below.
#
# IMPORTANT - the paths below are deliberately empty, and the branch keys are
# examples. Both must come from the API guide of the exact release you target:
# a path guessed from a neighbouring branch can resolve to a different resource
# and silently reconfigure the wrong thing. Rename the keys to the branches you
# actually run and fill each one in once; every appliance on that branch is then
# covered.
#
# The key is major.minor. The patch level in storeonce_release is ignored for
# selection (it does not change the REST surface) but is still recorded in the
# AAP artifact.
storeonce_release: ""

storeonce_api_contracts:
  "3.18":
    endpoints:
      local_accounts: ""
      ad: ""
      ntp: ""
      timezone: ""
      syslog: ""
      smtp: ""
      snmp: ""
    methods:
      local_accounts: POST
      ad: PUT
      ntp: PUT
      timezone: PUT
      syslog: PUT
      smtp: PUT
      snmp: PUT
    capabilities:
      # Older branches expose only v1/v2c on the SNMP endpoint. Requesting
      # v3 against a branch that lacks it fails in preflight with a clear
      # message instead of being silently downgraded by the appliance.
      snmp_v3: false
  "4.3":
    endpoints:
      local_accounts: ""
      ad: ""
      ntp: ""
      timezone: ""
      syslog: ""
      smtp: ""
      snmp: ""
    methods:
      local_accounts: POST
      ad: PUT
      ntp: PUT
      timezone: PUT
      syslog: PUT
      smtp: PUT
      snmp: PUT
    capabilities:
      snmp_v3: true

# --- Per-appliance overrides -------------------------------------------------
# Left empty, each of these falls back to the contract selected above. Set one
# to pin a single path or method for a single appliance without forking the
# whole table - an inventory written against the previous flat-variable form
# keeps working unchanged.
storeonce_local_accounts_endpoint: ""
# POST is not idempotent against most REST APIs: re-running the playbook
# against an account that already exists will fail unless the target
# release's endpoint accepts POST as an upsert. Set the branch's
# methods.local_accounts to PUT/PATCH if its API guide documents an
# idempotent update-by-username operation.
storeonce_local_accounts_method: ""
storeonce_local_accounts:
  - username: svc-ansible
    password: "{{ vault_storeonce_local_admin_password }}"
    role: administrator
    enabled: true

storeonce_ad_endpoint: ""
storeonce_ad_method: ""
storeonce_ad_configuration:
  enabled: true
  domain: example.local
  domain_controllers: [dc01.example.local, dc02.example.local]
  bind_username: "{{ vault_storeonce_ad_username }}"
  bind_password: "{{ vault_storeonce_ad_password }}"
  base_dn: DC=example,DC=local

storeonce_ntp_endpoint: ""
storeonce_ntp_method: ""
storeonce_ntp_configuration:
  enabled: true
  servers: [ntp01.example.local, ntp02.example.local]

storeonce_timezone_endpoint: ""
storeonce_timezone_method: ""
storeonce_timezone_configuration:
  timezone: Europe/Paris

# Optional - disabled by default, unlike the four settings above which are
# always applied. Enabling one requires its path to be present in the
# selected branch's contract (or overridden just below).
storeonce_syslog_enabled: false
storeonce_syslog_endpoint: ""
storeonce_syslog_method: ""
storeonce_syslog_configuration:
  enabled: true
  server: syslog01.example.local
  port: 514
  protocol: tcp

storeonce_smtp_enabled: false
storeonce_smtp_endpoint: ""
storeonce_smtp_method: ""
storeonce_smtp_configuration:
  enabled: true
  relay_host: smtp.example.local
  port: 25
  sender: storeonce01-alerts@example.local
  recipients: [storage-alerts@example.local]
  use_tls: true
  username: "{{ vault_storeonce_smtp_username | default('') }}"
  password: "{{ vault_storeonce_smtp_password | default('') }}"

# SNMPv3 (auth+priv) is the recommended contract if the target firmware
# supports it; check the API guide before assuming - some older StoreOnce
# releases only expose v1/v2c over this endpoint.
storeonce_snmp_enabled: false
storeonce_snmp_endpoint: ""
storeonce_snmp_method: ""
storeonce_snmp_configuration:
  enabled: true
  version: v3
  username: storeonce-snmp-v3
  auth_protocol: SHA
  auth_passphrase: "{{ vault_storeonce_snmp_auth_passphrase | default('') }}"
  privacy_protocol: AES
  privacy_passphrase: "{{ vault_storeonce_snmp_privacy_passphrase | default('') }}"
  trap_destination: snmp01.example.local
  trap_port: 162
