---
- name: Configure HPE StoreOnce Active Directory
  ansible.builtin.uri:
    url: "https://{{ storeonce_hostname }}{{ storeonce_endpoints.ad }}"
    method: "{{ storeonce_methods.ad }}"
    url_username: "{{ storeonce_api_username }}"
    url_password: "{{ storeonce_api_password }}"
    force_basic_auth: true
    validate_certs: "{{ storeonce_validate_certs }}"
    headers: "{{ storeonce_api_headers }}"
    body_format: json
    body: "{{ storeonce_ad_configuration }}"
    status_code: [200, 201, 202, 204]
  register: storeonce_ad_result
  changed_when: storeonce_ad_result.status in [201, 202, 204]
  no_log: true
