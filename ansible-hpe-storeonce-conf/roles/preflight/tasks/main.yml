---
- name: Validate HPE StoreOnce configuration request
  ansible.builtin.assert:
    that:
      - storeonce_hostname | length > 0
      - storeonce_api_username | length > 0
      - storeonce_api_password | length > 0
      - storeonce_local_accounts_endpoint is match('^/[^ ]+$')
      - storeonce_ad_endpoint is match('^/[^ ]+$')
      - storeonce_ntp_endpoint is match('^/[^ ]+$')
      - storeonce_timezone_endpoint is match('^/[^ ]+$')
      - storeonce_local_accounts | length > 0
      - storeonce_ntp_configuration.servers | length > 0
      - not storeonce_syslog_enabled | bool or storeonce_syslog_endpoint is match('^/[^ ]+$')
      - not storeonce_smtp_enabled | bool or storeonce_smtp_endpoint is match('^/[^ ]+$')
      - not storeonce_snmp_enabled | bool or storeonce_snmp_endpoint is match('^/[^ ]+$')
    fail_msg: >-
      Credentials and firmware-specific HTTPS API paths are mandatory.
      Copy paths/payloads from the API guide for the target release;
      enabling syslog/SMTP/SNMP each requires their own validated endpoint.

- name: Validate each local account has a username and password
  ansible.builtin.assert:
    that:
      - item.username | default('') | length > 0
      - item.password | default('') | length > 0
    fail_msg: "Every entry in storeonce_local_accounts requires a username and password."
  loop: "{{ storeonce_local_accounts }}"
  loop_control:
    label: "{{ item.username | default('(missing username)') }}"
