---
- name: Configure HPE StoreOnce timezone
  ansible.builtin.uri:
    url: "https://{{ storeonce_hostname }}{{ storeonce_timezone_endpoint }}"
    method: "{{ storeonce_timezone_method }}"
    url_username: "{{ storeonce_api_username }}"
    url_password: "{{ storeonce_api_password }}"
    force_basic_auth: true
    validate_certs: "{{ storeonce_validate_certs }}"
    headers: "{{ storeonce_api_headers }}"
    body_format: json
    body: "{{ storeonce_timezone_configuration }}"
    status_code: [200, 201, 202, 204]
  register: storeonce_timezone_result
  changed_when: storeonce_timezone_result.status in [201, 202, 204]
  no_log: true
