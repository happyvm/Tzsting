---
oneview_hostname: oneview.example.local
oneview_username: "{{ vault_oneview_username }}"
oneview_password: "{{ vault_oneview_password }}"
oneview_auth_login_domain: LOCAL
oneview_api_version: 3000
oneview_locale: fr_FR.UTF-8
oneview_timezone: Europe/Paris
oneview_ntp_servers:
  - ntp01.example.local
  - ntp02.example.local
oneview_local_admin:
  userName: svc-ansible
  password: "{{ vault_oneview_local_admin_password }}"
  fullName: Ansible automation account
  emailAddress: storage@example.local
  enabled: true
  permissions:
    - roleName: Infrastructure administrator
# Directory/authentication provider schemas differ by OneView API generation.
# Supply the payload validated for your appliance; keep disabled until then.
oneview_ad_enabled: false
oneview_ad_api_path: /rest/authn/providers
oneview_ad_method: POST
oneview_ad_configuration: {}

# Remote syslog forwarding - no hpe.oneview module covers this; the REST
# contract (endpoint/payload) is release-specific, left blank until
# validated against the target appliance (same reasoning as the AD role).
oneview_syslog_enabled: false
oneview_syslog_api_path: ""
oneview_syslog_method: PUT
oneview_syslog_configuration: {}

# SMTP alert email - same reasoning as syslog above.
oneview_smtp_enabled: false
oneview_smtp_api_path: ""
oneview_smtp_method: PUT
oneview_smtp_configuration: {}

# SNMPv3 users and trap destinations, via the real hpe.oneview modules. The
# data payload shapes below match the modules' own documented examples, but
# securityLevel/protocol values still depend on the OneView API generation -
# validate before enabling.
oneview_snmp_enabled: false
oneview_snmp_v3_users: []
# - name: pure-snmp-v3
#   data:
#     type: Users
#     userName: pure-snmp-v3
#     securityLevel: AuthAndPrivacy
#     authenticationProtocol: SHA512
#     authenticationPassphrase: "{{ vault_oneview_snmp_auth_passphrase }}"
#     privacyProtocol: AES256
#     privacyPassphrase: "{{ vault_oneview_snmp_privacy_passphrase }}"
oneview_snmp_v3_trap_destinations: []
# - name: snmp01.example.local
#   data:
#     destinationAddress: snmp01.example.local
#     port: 162
#     userName: pure-snmp-v3
