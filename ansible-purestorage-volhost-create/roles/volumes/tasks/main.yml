---
- name: Create or grow FlashArray volumes
  purestorage.flasharray.purefa_volume:
    fa_url: "{{ pure_fa_url }}"
    api_token: "{{ pure_api_token }}"
    name: "{{ item.name }}"
    size: "{{ item.size }}"
    with_default_protection: "{{ item.with_default_protection | default(true) }}"
    state: present
  loop: "{{ pure_volumes }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
