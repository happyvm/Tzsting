---
- name: Connect volumes directly to hosts
  purestorage.flasharray.purefa_host:
    fa_url: "{{ pure_fa_url }}"
    api_token: "{{ pure_api_token }}"
    name: "{{ item.host }}"
    volume: "{{ item.volume }}"
    lun: "{{ item.lun | default(omit) }}"
    state: present
  loop: "{{ pure_host_volume_connections }}"
  loop_control:
    label: "{{ item.host }} -> {{ item.volume }}"
  no_log: true
