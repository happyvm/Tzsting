---
# Applies the memory change via SCVMM (Set-SCVirtualMachine -MemoryMB)
# instead of the native Hyper-V cmdlets directly - used instead of
# resize_ram_hyperv whenever compute_managed_by_scvmm is true. Always
# cold (power-off/change/power-on), matching Microsoft's own documented
# Set-SCVirtualMachine examples, which power the VM off before every
# memory change shown - including when enabling Dynamic Memory.
#
# No Dynamic Memory for now (1:1 static memory only, matching this
# project's current scope, same as resize_ram_hyperv) - every change
# here explicitly disables it and sets a flat MemoryMB, flattening an
# existing Dynamic Memory VM to static if it had one configured.

- name: Assert required variables are defined
  ansible.builtin.assert:
    that:
      - scvmm_server is defined
      - scvmm_server | length > 0
      - vm_name is defined
      - memory_gb is defined

- name: Power-cycle and apply the memory change via SCVMM
  when: compute_ram_grow or compute_ram_shrink
  delegate_to: "{{ scvmm_server | default('localhost', true) }}"
  ansible.windows.win_shell:
    cmd: |
      $ErrorActionPreference = "Stop"
      Import-Module virtualmachinemanager -ErrorAction SilentlyContinue
      Get-SCVMMServer -ComputerName '{{ scvmm_server }}' | Out-Null

      $vm = Get-SCVirtualMachine -Name '{{ vm_name }}'
      if (-not $vm) {
          throw "VM '{{ vm_name }}' not found in SCVMM"
      }

      $wasRunning = ($vm.Status -ne 'PowerOff')
      if ($wasRunning) {
          Stop-SCVirtualMachine -VM $vm | Out-Null
      }

      Set-SCVirtualMachine -VM $vm -DynamicMemoryEnabled $false -MemoryMB {{ (memory_gb | float * 1024) | round(0) | int }} | Out-Null

      if ($wasRunning) {
          Start-SCVirtualMachine -VM $vm | Out-Null
      }

      [PSCustomObject]@{
          WasRunning   = $wasRunning
          CurrentState = (Get-SCVirtualMachine -Name '{{ vm_name }}').Status.ToString()
      } | ConvertTo-Json -Compress
  register: resize_ram_result

- name: Report the new memory size
  when: compute_ram_grow or compute_ram_shrink
  ansible.builtin.debug:
    msg: >-
      '{{ vm_name }}' memory changed from {{ (compute_ram_current_mb | int / 1024) | round(2) }}GB to {{ memory_gb }}GB
      via SCVMM (power-cycled, static 1:1; final state: {{ (resize_ram_result.stdout | trim | from_json).CurrentState }}).
