---
- name: Resolve assigned profile name when not supplied
  ansible.builtin.set_fact:
    synergy_resolved_profile_name: "{{ oneview_server_profile_name if oneview_server_profile_name | length > 0 else (server_hardwares[0].serverProfileName | default('')) }}"

- name: Retrieve assigned server profile facts
  hpe.oneview.oneview_server_profile_facts:
    hostname: "{{ oneview_hostname }}"
    username: "{{ oneview_username }}"
    password: "{{ oneview_password }}"
    auth_login_domain: "{{ oneview_auth_login_domain }}"
    api_version: "{{ oneview_api_version }}"
    name: "{{ synergy_resolved_profile_name }}"
  no_log: true
  when: synergy_resolved_profile_name | length > 0

- name: Normalize an absent profile
  ansible.builtin.set_fact:
    server_profiles: []
  when: synergy_resolved_profile_name | length == 0
