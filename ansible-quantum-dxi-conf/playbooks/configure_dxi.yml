---
- name: Configure Quantum DXi identity, authentication and time services
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Validate request and release-specific API contract
      ansible.builtin.include_role: {name: preflight}
    - name: Maintain local accounts
      ansible.builtin.include_role: {name: local_accounts}
    - name: Configure Active Directory
      ansible.builtin.include_role: {name: active_directory}
    - name: Configure NTP
      ansible.builtin.include_role: {name: ntp}
    - name: Configure timezone
      ansible.builtin.include_role: {name: timezone}
    - name: Configure remote syslog forwarding
      ansible.builtin.include_role: {name: syslog}
    - name: Configure SMTP alert email
      ansible.builtin.include_role: {name: smtp}
    - name: Configure SNMP
      ansible.builtin.include_role: {name: snmp}
    - name: Publish AAP artifact
      ansible.builtin.set_stats:
        data:
          dxi_conf_summary:
            appliance: "{{ dxi_hostname }}"
            local_accounts: "{{ dxi_local_accounts | map(attribute='username') | list }}"
            ad_domain: "{{ dxi_ad_configuration.domain | default('unspecified') }}"
            ntp_servers: "{{ dxi_ntp_configuration.servers }}"
            timezone: "{{ dxi_timezone_configuration.timezone | default('unspecified') }}"
            syslog_configured: "{{ dxi_syslog_enabled | bool }}"
            smtp_configured: "{{ dxi_smtp_enabled | bool }}"
            snmp_configured: "{{ dxi_snmp_enabled | bool }}"
        aggregate: false
