---
- name: Configure Quantum DXi SNMP
  when: dxi_snmp_enabled | bool
  ansible.builtin.uri:
    url: "https://{{ dxi_hostname }}{{ dxi_snmp_endpoint }}"
    method: "{{ dxi_snmp_method }}"
    url_username: "{{ dxi_api_username }}"
    url_password: "{{ dxi_api_password }}"
    force_basic_auth: true
    validate_certs: "{{ dxi_validate_certs }}"
    headers: "{{ dxi_api_headers }}"
    body_format: json
    body: "{{ dxi_snmp_configuration }}"
    status_code: [200, 201, 202, 204]
  register: dxi_snmp_result
  changed_when: dxi_snmp_result.status in [201, 202, 204]
  no_log: true
