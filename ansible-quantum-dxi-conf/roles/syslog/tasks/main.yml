---
- name: Configure Quantum DXi remote syslog forwarding
  when: dxi_syslog_enabled | bool
  ansible.builtin.uri:
    url: "https://{{ dxi_hostname }}{{ dxi_syslog_endpoint }}"
    method: "{{ dxi_syslog_method }}"
    url_username: "{{ dxi_api_username }}"
    url_password: "{{ dxi_api_password }}"
    force_basic_auth: true
    validate_certs: "{{ dxi_validate_certs }}"
    headers: "{{ dxi_api_headers }}"
    body_format: json
    body: "{{ dxi_syslog_configuration }}"
    status_code: [200, 201, 202, 204]
  register: dxi_syslog_result
  changed_when: dxi_syslog_result.status in [201, 202, 204]
  no_log: true
